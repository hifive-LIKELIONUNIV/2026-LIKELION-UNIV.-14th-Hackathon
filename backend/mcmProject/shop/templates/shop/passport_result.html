<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TIME PASSPORT</title>
</head>
<body>
    <h1>TIME PASSPORT</h1>
    <p>{{ selection.product.name }}</p>

    <div style="display:flex; gap:32px; align-items:flex-start;">
        <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; width:400px;">
            {% for result in results %}
                <div>
                    <img src="{{ result.generated_image.url }}"
                         style="width:100%; aspect-ratio: 3 / 4; object-fit:cover; display:block; border:1px solid #444;">
                    <p style="text-align:center;">{{ result.era }}</p>
                </div>
            {% endfor %}
        </div>

        <div style="text-align:center;">
            <p>사진을 휴대폰에 저장하세요</p>
            <img src="{% url 'shop:passport_qrcode' selection.id %}" alt="QR 코드" width="200" height="200">
            <p>휴대폰으로 QR코드를 스캔해주세요</p>
        </div>
    </div>

    <p style="margin-top:24px;">
        <a href="{% url 'shop:recommend_products' selection.id %}"><button type="button">다음 단계로</button></a>
    </p>
</body>
</html>

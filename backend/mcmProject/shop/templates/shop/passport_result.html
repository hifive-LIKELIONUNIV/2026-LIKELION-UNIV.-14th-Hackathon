<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TIME PASSPORT</title>
</head>
<body>
    <h1>TIME PASSPORT</h1>
    <p>{{ selection.product.name }}</p>

    <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; width:640px;">
        {% for result in results %}
            <div>
                <img src="{{ result.generated_image.url }}"
                     style="width:100%; height:280px; object-fit:cover; border:1px solid #444;">
                <p style="text-align:center;">{{ result.era }}</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>얼굴 촬영</title>
</head>
<body>
    <button id="back-btn">이전</button>

    <!-- 1단계: 카메라 권한/로딩 대기 화면 -->
    <div id="idle-screen">
        <h1>얼굴을 인식해주세요</h1>
        <div style="width:300px; height:335px; border:1px solid #444; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <p>📷</p>
            <p>카메라 활성화 중</p>
        </div>
        <p>촬영된 얼굴 이미지는 TIME PORTAL 체험 이미지 생성에만 사용됩니다.</p>
    </div>

    <!-- 2단계: 카메라 화면. 권한 허용되면 자동으로 표시되고,
         매 촬영(1번째/2번째) 전에 '촬영하기' 버튼이 다시 노출됨 -->
    <div id="camera-screen" style="display:none;">
        <h1>얼굴을 인식해주세요.</h1>
        <div style="position:relative; width:300px; height:335px;">
            <video id="video" width="600" height="670" autoplay
                   style="width:300px; height:335px; object-fit:cover;"></video>
            <div id="countdown"
                 style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); color:#fff; font-size:80px; align-items:center; justify-content:center;"></div>
        </div>
        <p id="progress">0 / 2</p>
        <p id="status-text">촬영 가능 횟수</p>
        <button id="start-btn" style="display:none;">촬영하기</button>
    </div>

    <canvas id="canvas" width="600" height="670" style="display:none;"></canvas>

    <script>
        const idleScreen = document.getElementById('idle-screen');
        const cameraScreen = document.getElementById('camera-screen');
        const startBtn = document.getElementById('start-btn');
        const backBtn = document.getElementById('back-btn');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const countdownEl = document.getElementById('countdown');
        const progress = document.getElementById('progress');
        const statusText = document.getElementById('status-text');

        const selectionId = {{ selection.id }};
        let photoCount = {{ photo_count }};
        let stream = null;
        let countdownTimer = null;
        let inCameraStep = false;

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        backBtn.addEventListener('click', () => {
            stopCameraAndTimers();
            window.history.back();
        });

        function stopCameraAndTimers() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            countdownEl.style.display = 'none';
        }

        // 페이지 진입 시 바로 카메라 권한 요청 + 미리보기 시작
        // (아직 촬영은 시작하지 않음 — '촬영하기' 버튼을 눌러야 카운트다운이 시작됨)
        function initCamera() {
            navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 600 },
                    height: { ideal: 670 }
                }
            })
                .then(s => {
                    stream = s;
                    video.srcObject = stream;
                    idleScreen.style.display = 'none';
                    cameraScreen.style.display = 'block';
                    inCameraStep = true;
                    showStartButton();
                })
                .catch(err => {
                    alert('웹캠 접근에 실패했습니다: ' + err.message);
                });
        }

        function showStartButton() {
            statusText.textContent = '촬영 가능 횟수';
            startBtn.style.display = 'inline-block';
        }

        // '촬영하기' 클릭 -> 카운트다운 시작 (1번째, 2번째 촬영 모두 이 버튼을 거침)
        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            startCountdown();
        });

        // 카운트다운 후 자동 캡처
        function startCountdown() {
            let count = 5;
            countdownEl.style.display = 'flex';
            countdownEl.textContent = count;

            countdownTimer = setInterval(() => {
                count -= 1;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    countdownEl.style.display = 'none';
                    capturePhoto();
                }
            }, 1000);
        }

        // 실제 캡처 + 서버 전송
        function capturePhoto() {
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');

            const formData = new FormData();
            formData.append('image_data', imageData);

            fetch(`/shop/capture/${selectionId}/save/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: formData,
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    showStartButton(); // 실패했으면 다시 촬영할 수 있게 버튼 복구
                    return;
                }

                photoCount = data.photo_count;
                progress.textContent = `${photoCount} / 2`;

                if (data.next_step === 'choose') {
                    stopCameraAndTimers();
                    inCameraStep = false;
                    window.location.href = `/shop/capture/${selectionId}/choose/`;
                } else {
                    // 2번째 촬영도 자동 시작하지 않고 '촬영하기' 버튼을 다시 보여줌
                    showStartButton();
                }
            })
            .catch(err => {
                alert('저장 실패: ' + err.message);
                showStartButton();
            });
        }

        initCamera();
    </script>
</body>
</html>

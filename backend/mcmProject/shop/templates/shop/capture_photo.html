<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>얼굴 촬영</title>
</head>
<body>
    <button id="back-btn">이전</button>

    <!-- 1단계: 대기 화면 -->
    <div id="idle-screen">
        <h1>얼굴을 인식해주세요</h1>
        <div style="width:300px; height:335px; border:1px solid #444; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <p>📷</p>
            <p>카메라 활성화 중</p>
        </div>
        <p>촬영된 얼굴 이미지는 TIME PORTAL 체험 이미지 생성에만 사용됩니다.</p>
        <button id="start-btn">촬영하기</button>
    </div>

    <!-- 2단계: 웹캠 활성화 + 자동 촬영 화면 (처음엔 숨김) -->
    <div id="camera-screen" style="display:none;">
        <h1>얼굴을 인식해주세요.</h1>
        <div style="position:relative; width:300px; height:335px;">
            <video id="video" width="600" height="670" autoplay
                   style="width:300px; height:335px; object-fit:cover;"></video>
            <div id="countdown"
                 style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); color:#fff; font-size:80px; align-items:center; justify-content:center;"></div>
        </div>
        <p id="progress">0 / 2</p>
        <p id="status-text">촬영 가능 횟수</p>
    </div>

    <canvas id="canvas" width="600" height="670" style="display:none;"></canvas>

    <script>
        const idleScreen = document.getElementById('idle-screen');
        const cameraScreen = document.getElementById('camera-screen');
        const startBtn = document.getElementById('start-btn');
        const backBtn = document.getElementById('back-btn');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const countdownEl = document.getElementById('countdown');
        const progress = document.getElementById('progress');
        const statusText = document.getElementById('status-text');

        const selectionId = {{ selection.id }};
        let photoCount = {{ photo_count }};
        let stream = null;
        let countdownTimer = null;
        let nextShotTimer = null;
        let inCameraStep = false;

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        // 상단 이전 버튼: 카메라 단계면 대기화면 복귀, 아니면 이전 페이지로
        backBtn.addEventListener('click', () => {
            if (inCameraStep) {
                stopCameraAndTimers();
                cameraScreen.style.display = 'none';
                idleScreen.style.display = 'block';
                inCameraStep = false;
            } else {
                window.history.back();
            }
        });

        function stopCameraAndTimers() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            if (nextShotTimer) {
                clearTimeout(nextShotTimer);
                nextShotTimer = null;
            }
            countdownEl.style.display = 'none';
        }

        // 1단계 → 2단계: 웹캠 켜고, 자동으로 전체 촬영 시퀀스 시작
        startBtn.addEventListener('click', () => {
            navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 600 },
                    height: { ideal: 670 }
                }
            })
                .then(s => {
                    stream = s;
                    video.srcObject = stream;
                    idleScreen.style.display = 'none';
                    cameraScreen.style.display = 'block';
                    inCameraStep = true;
                    startCountdown();
                })
                .catch(err => {
                    alert('웹캠 접근에 실패했습니다: ' + err.message);
                });
        });

        // 카운트다운 후 자동 캡처
        function startCountdown() {
            statusText.textContent = '';
            let count = 5;
            countdownEl.style.display = 'flex';
            countdownEl.textContent = count;

            countdownTimer = setInterval(() => {
                count -= 1;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    countdownEl.style.display = 'none';
                    capturePhoto();
                }
            }, 1000);
        }

        // 실제 캡처 + 서버 전송
        function capturePhoto() {
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');

            const formData = new FormData();
            formData.append('image_data', imageData);

            fetch(`/shop/capture/${selectionId}/save/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: formData,
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }

                photoCount = data.photo_count;
                progress.textContent = `${photoCount} / 2`;

                if (data.next_step === 'choose') {
                    stopCameraAndTimers();
                    inCameraStep = false;
                    window.location.href = `/shop/capture/${selectionId}/choose/`;
                } else {
                    statusText.textContent = '촬영 가능 횟수';
                    nextShotTimer = setTimeout(startCountdown, 800);
                }
            })
            .catch(err => {
                alert('저장 실패: ' + err.message);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사진 선택</title>
</head>
<body>
    <button type="button" onclick="window.history.back();">이전</button>

    <h1>어떤 사진으로 떠날까요?</h1>
    <p>마음에 드는 사진 한 장을 선택해주세요.</p>

    <form method="post" action="{% url 'shop:choose_photo' selection.id %}">
        {% csrf_token %}
        {% for photo in photos %}
            <div style="display:inline-block; margin: 10px;">
                <img src="{{ photo.image.url }}" width="200" height="223" style="object-fit:cover; display:block; border:2px solid #ccc; border-radius:8px;">
                <input type="radio" name="photo_id" value="{{ photo.id }}" id="photo-{{ photo.id }}" required>
                <label for="photo-{{ photo.id }}">이 사진 선택</label>
            </div>
        {% endfor %}
        <br>
        <button type="submit">시간 여행 시작하기</button>
    </form>
</body>
</html>

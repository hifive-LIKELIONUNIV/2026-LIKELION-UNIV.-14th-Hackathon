<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사진 선택</title>
</head>
<body>
    <button type="button" onclick="window.history.back();">이전</button>

    <h1>어떤 사진으로 떠날까요?</h1>
    <p>마음에 드는 사진을 클릭해서 선택해주세요.</p>

    <form id="choose-form" method="post" action="{% url 'shop:choose_photo' selection.id %}">
        {% csrf_token %}
        <input type="hidden" name="photo_id" id="photo-id-input" value="">

        {% for photo in photos %}
            <div class="photo-option" data-photo-id="{{ photo.id }}"
                 style="display:inline-block; margin: 10px; cursor:pointer;">
                <img src="{{ photo.image.url }}" width="200" height="267"
                     style="object-fit:cover; display:block; border:3px solid #ccc; border-radius:8px;">
            </div>
        {% endfor %}
        <br>
        <button id="submit-btn" type="submit" disabled>시간 여행 시작하기</button>
    </form>

    <script>
        const options = document.querySelectorAll('.photo-option');
        const photoIdInput = document.getElementById('photo-id-input');
        const submitBtn = document.getElementById('submit-btn');

        options.forEach(option => {
            option.addEventListener('click', () => {
                options.forEach(o => {
                    o.querySelector('img').style.borderColor = '#ccc';
                });
                option.querySelector('img').style.borderColor = '#c98a4b';
                photoIdInput.value = option.dataset.photoId;
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>

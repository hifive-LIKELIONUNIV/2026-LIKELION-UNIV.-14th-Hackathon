<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ era_meta.label }}년으로 이동 중</title>
</head>
<body>
    <h1>{{ era_meta.label }}년으로 이동하고 있습니다...</h1>

    <div id="progress-wrap">
        <div style="width:400px; height:8px; background:#333; border-radius:4px; overflow:hidden;">
            <div id="progress-bar" style="width:0%; height:100%; background:#c98a4b; transition: width 0.2s linear;"></div>
        </div>
        <p id="progress-text">0%</p>
        <p id="hint-text" style="color:#888;"></p>
    </div>

    <!-- 실패 시 여기로 전환 (기본 숨김) -->
    <div id="error-box" style="display:none;">
        <p>이미지 생성에 실패했어요. 잠시 후 다시 시도해주세요.</p>
        <button id="retry-btn" type="button">다시 시도</button>
    </div>

    <script>
        const selectionId = {{ selection.id }};
        const era = "{{ era }}";

        const progressWrap = document.getElementById('progress-wrap');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const hintText = document.getElementById('hint-text');
        const errorBox = document.getElementById('error-box');
        const retryBtn = document.getElementById('retry-btn');

        // 예상 소요시간(ms) — 실측 평균에 맞춰 조정할 것
        const EXPECTED_DURATION = 18000;
        const CAP = 92; // 실제 완료 신호 오기 전까지 도달 가능한 최대 %
        const MIN_VISIBLE_MS = 10000; // 프리페치 등으로 너무 빨리 끝나도 최소 이 시간은 진행률을 보여줌
        const POLL_INTERVAL_MS = 1000; // 백그라운드 프리페치 진행 상황 폴링 주기

        let startTime = null;
        let finished = false;
        let tickTimer = null;
        let pollTimer = null;

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function updateProgress() {
            if (finished) return;
            const elapsed = Date.now() - startTime;
            // 지수적으로 CAP%에 점근 -> 평소엔 예상시간 근처에서 90%대,
            // 오래 걸려도 완료 전까지 아주 천천히 계속 올라감 (멈춘 것처럼 안 보이게)
            const pct = CAP * (1 - Math.exp(-elapsed / EXPECTED_DURATION));
            progressBar.style.width = pct.toFixed(0) + '%';
            progressText.textContent = pct.toFixed(0) + '%';

            if (elapsed > EXPECTED_DURATION * 1.3) {
                hintText.textContent = '조금만 더 기다려주세요...';
            }
        }

        function finishProgress(onDone) {
            finished = true;
            clearInterval(tickTimer);
            clearInterval(pollTimer);
            progressBar.style.transition = 'width 0.4s ease-out';
            progressBar.style.width = '100%';
            progressText.textContent = '100%';
            setTimeout(onDone, 400);
        }

        function showError() {
            finished = true;
            clearInterval(tickTimer);
            clearInterval(pollTimer);
            progressWrap.style.display = 'none';
            errorBox.style.display = 'block';
        }

        function resetForRetry() {
            finished = false;
            errorBox.style.display = 'none';
            progressWrap.style.display = 'block';
            progressBar.style.transition = 'width 0.2s linear';
            progressBar.style.width = '0%';
            progressText.textContent = '0%';
            hintText.textContent = '';
        }

        function finishAndRedirect(redirectUrl) {
            // 실제 완료가 너무 빨리 와도(프리페치로 이미 끝나 있던 경우 등)
            // 최소 노출 시간만큼은 기다렸다가 100%로 마무리
            const elapsed = Date.now() - startTime;
            const minWait = Math.max(0, MIN_VISIBLE_MS - elapsed);
            setTimeout(() => {
                finishProgress(() => {
                    window.location.href = redirectUrl;
                });
            }, minWait);
        }

        function requestGeneration() {
            fetch(`/shop/capture/${selectionId}/era/${era}/generate/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
            })
            .then(res => res.json())
            .then(data => {
                if (data.processing) {
                    // 그 사이 다른 요청(백그라운드 프리페치 등)이 이미 생성을 시작함 -> 폴링으로 전환
                    pollUntilDone();
                    return;
                }
                if (data.error) {
                    console.error('[era_generate] 실패:', data.error);
                    showError();
                    return;
                }
                finishAndRedirect(data.redirect);
            })
            .catch(err => {
                console.error('[era_generate] 요청 오류:', err);
                showError();
            });
        }

        function pollUntilDone() {
            pollTimer = setInterval(() => {
                fetch(`/shop/capture/${selectionId}/era/${era}/status/`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'done') {
                        clearInterval(pollTimer);
                        finishAndRedirect(data.redirect);
                    } else if (data.status === 'failed') {
                        clearInterval(pollTimer);
                        console.error('[era_status] 백그라운드 생성 실패');
                        showError();
                    }
                    // 'processing'이면 계속 기다림
                })
                .catch(err => {
                    // 네트워크 일시 오류는 무시하고 계속 폴링
                    console.error('[era_status] 폴링 오류:', err);
                });
            }, POLL_INTERVAL_MS);
        }

        function startGeneration() {
            startTime = Date.now();
            tickTimer = setInterval(updateProgress, 200);

            // 이미 백그라운드에서 미리 생성 중이거나(프리페치) 끝나 있는지 먼저 확인 —
            // 끝나 있으면 바로 넘어가고, 진행 중이면 폴링만 하고 새로 생성 요청은 안 보냄
            fetch(`/shop/capture/${selectionId}/era/${era}/status/`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'done') {
                    finishAndRedirect(data.redirect);
                } else if (data.status === 'processing') {
                    pollUntilDone();
                } else {
                    requestGeneration();
                }
            })
            .catch(() => {
                // 상태 확인 자체가 실패하면 그냥 생성 요청으로 진행
                requestGeneration();
            });
        }

        retryBtn.addEventListener('click', () => {
            resetForRetry();
            startGeneration();
        });

        startGeneration();
    </script>
</body>
</html>

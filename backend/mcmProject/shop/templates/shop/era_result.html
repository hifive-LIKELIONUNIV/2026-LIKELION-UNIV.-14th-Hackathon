<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ era_meta.label }} 결과</title>
</head>
<body>
    <h1>{{ era_meta.label }} 결과</h1>

    <!-- 시대 타임라인 -->
    <div style="margin-bottom:16px;">
        {% for e in era_order %}
            <span style="margin-right:16px; {% if e == era %}font-weight:bold; color:#c98a4b;{% else %}color:#888;{% endif %}">{{ e }}</span>
        {% endfor %}
    </div>

    <div style="display:flex; gap:24px;">
        <div style="position:relative; width:300px; height:400px; border:1px solid #444;">
            <img id="result-image" src="{{ result.generated_image.url }}"
                 style="width:100%; height:100%; object-fit:cover; display:block;">

            <!-- 다시 생성 중 로딩 오버레이 (기본 숨김, 사진 창 안에서만 로딩) -->
            <div id="regen-overlay"
                 style="display:none; position:absolute; top:0; left:0; width:100%; height:100%;
                        background:rgba(0,0,0,0.6); color:#fff; flex-direction:column;
                        align-items:center; justify-content:center;">
                <div style="width:70%; height:6px; background:#333; border-radius:3px; overflow:hidden;">
                    <div id="regen-progress-bar" style="width:0%; height:100%; background:#c98a4b;"></div>
                </div>
                <p id="regen-progress-text">0%</p>
            </div>
        </div>

        <div>
            <h2>{{ era_meta.title }}</h2>
            <h3>{{ era_meta.subtitle }}</h3>
            <p style="max-width:320px;">{{ era_meta.description }}</p>

            <div style="margin-top:24px; display:flex; gap:12px;">
                {% if can_regenerate %}
                    <button id="regen-btn" type="button">다시 생성</button>
                {% endif %}

                {% if next_era == '2026' %}
                    <a href="{% url 'shop:era_2026_capture' selection.id %}"><button type="button">다음 시대로</button></a>
                {% elif next_era %}
                    <a href="{% url 'shop:era_loading' selection.id next_era %}"><button type="button">다음 시대로</button></a>
                {% else %}
                    <a href="{% url 'shop:passport_result' selection.id %}"><button type="button">결과 모아보기</button></a>
                {% endif %}
            </div>
        </div>
    </div>

    <script>
        const selectionId = {{ selection.id }};
        const era = "{{ era }}";
        const regenBtn = document.getElementById('regen-btn');
        const overlay = document.getElementById('regen-overlay');
        const regenBar = document.getElementById('regen-progress-bar');
        const regenText = document.getElementById('regen-progress-text');
        const resultImage = document.getElementById('result-image');

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        if (regenBtn) {
            regenBtn.addEventListener('click', () => {
                // "다시 생성"은 1회 제한 -> 클릭 즉시 버튼 숨기고, 사진 창 안에서만 로딩 표시
                regenBtn.style.display = 'none';
                overlay.style.display = 'flex';

                const EXPECTED_DURATION = 18000;
                const CAP = 92;
                const startTime = Date.now();
                let finished = false;

                const tickTimer = setInterval(() => {
                    if (finished) return;
                    const elapsed = Date.now() - startTime;
                    const pct = CAP * (1 - Math.exp(-elapsed / EXPECTED_DURATION));
                    regenBar.style.width = pct.toFixed(0) + '%';
                    regenText.textContent = pct.toFixed(0) + '%';
                }, 200);

                fetch(`/shop/capture/${selectionId}/era/${era}/regenerate/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') },
                })
                .then(res => res.json())
                .then(data => {
                    finished = true;
                    clearInterval(tickTimer);
                    if (data.error) {
                        alert('다시 생성에 실패했습니다: ' + data.error);
                        overlay.style.display = 'none';
                        return;
                    }
                    regenBar.style.width = '100%';
                    regenText.textContent = '100%';
                    setTimeout(() => {
                        resultImage.src = data.image_url + '?t=' + Date.now();
                        overlay.style.display = 'none';
                    }, 400);
                })
                .catch(err => {
                    finished = true;
                    clearInterval(tickTimer);
                    alert('요청 중 오류: ' + err.message);
                    overlay.style.display = 'none';
                });
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ era_meta.label }} 사진 선택</title>
</head>
<body>
    <h1>어떤 사진으로 할까요?</h1>
    <p>마음에 드는 사진을 클릭해서 선택해주세요.</p>

    <div style="display:flex; gap:24px;">
        <div class="regen-option" data-choice="original" style="cursor:pointer;">
            <p>1번째 사진 (기존)</p>
            <img src="{{ result.generated_image.url }}" width="240" height="320"
                 style="object-fit:cover; display:block; border:3px solid #ccc; border-radius:8px;">
        </div>
        <div class="regen-option" data-choice="candidate" style="cursor:pointer;">
            <p>2번째 사진 (새로 생성)</p>
            <img src="{{ result.regen_candidate_image.url }}" width="240" height="320"
                 style="object-fit:cover; display:block; border:3px solid #ccc; border-radius:8px;">
        </div>
    </div>

    <!-- 선택 확인 모달 (기본 숨김) -->
    <div id="confirm-modal"
         style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
                background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div style="background:#fff; color:#111; padding:24px 28px; border-radius:8px; text-align:center; min-width:260px;">
            <p id="confirm-text"></p>
            <div style="margin-top:16px; display:flex; gap:12px; justify-content:center;">
                <button id="confirm-no" type="button">아니오</button>
                <button id="confirm-yes" type="button">예</button>
            </div>
        </div>
    </div>

    <script>
        const selectionId = {{ selection.id }};
        const era = "{{ era }}";

        const modal = document.getElementById('confirm-modal');
        const confirmText = document.getElementById('confirm-text');
        const confirmYes = document.getElementById('confirm-yes');
        const confirmNo = document.getElementById('confirm-no');

        let pendingChoice = null;

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        document.querySelectorAll('.regen-option').forEach((option, index) => {
            option.addEventListener('click', () => {
                pendingChoice = option.dataset.choice;
                confirmText.textContent = `${index + 1}번째 사진을 선택하시겠습니까?`;
                modal.style.display = 'flex';
            });
        });

        // 아니오 -> 모달만 닫고 선택 화면 그대로 유지
        confirmNo.addEventListener('click', () => {
            modal.style.display = 'none';
            pendingChoice = null;
        });

        // 예 -> 서버에 확정 반영 후 결과 화면으로 이동
        confirmYes.addEventListener('click', () => {
            if (!pendingChoice) return;
            confirmYes.disabled = true;
            confirmNo.disabled = true;

            fetch(`/shop/capture/${selectionId}/era/${era}/regenerate/confirm/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken'),
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `choice=${pendingChoice}`,
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    console.error('[era_regen_confirm] 실패:', data.error);
                    modal.style.display = 'none';
                    confirmYes.disabled = false;
                    confirmNo.disabled = false;
                    return;
                }
                window.location.href = data.redirect;
            })
            .catch(err => {
                console.error('[era_regen_confirm] 요청 오류:', err);
                modal.style.display = 'none';
                confirmYes.disabled = false;
                confirmNo.disabled = false;
            });
        });
    </script>
</body>
</html>

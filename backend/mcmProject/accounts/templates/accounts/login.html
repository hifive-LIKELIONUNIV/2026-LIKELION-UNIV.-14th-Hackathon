<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
</head>
<body>

  <h1>TIME PORTAL</h1>

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <label>이메일 주소: <input type="email" name="username" required></label><br>
    <label>비밀번호: <input type="password" name="password" required></label><br>
    <button type="submit">로그인하기</button>
  </form>

  <a href="#">로그인 없이 체험하기</a>

</body>
</html>
